<html lang="zh-CN">

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f8fafc;color:#1e293b;padding:16px;max-width:1200px;margin:0 auto}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:#64748b}
.badge{display:inline-block;border:1px solid #e2e8f0;background:#f8fafc;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:500;color:#334155;text-decoration:none}
.badge:hover{background:#f1f5f9}
.spec-badge{font-size:10px;padding:2px 8px}
.chart-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-bottom:8px;position:relative}
.chart-spec{position:absolute;top:8px;right:8px}
table{width:100%;font-size:12px;border-collapse:collapse}
th{text-align:left;padding:4px 12px 4px 0;color:#64748b;font-weight:500;border-bottom:1px solid #e2e8f0}
td{padding:4px 12px 4px 0;font-variant-numeric:tabular-nums;font-weight:500}
.legend{display:flex;flex-direction:column;gap:2px;font-size:11px;margin-top:8px}
.legend-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-val{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;color:#0f172a}
.error{color:#ef4444;font-size:11px;margin-top:8px}
.loading{color:#94a3b8;font-size:11px;margin-top:8px}
canvas{width:100%!important}
</style>
</head>

function shortDate(d){const p=d.split("-");return p[0].slice(-2)+"/"+p[1]+"/"+p[2]}
function fmt2(v){return Number(v).toFixed(2)}
function fmtPct(cur,base){if(!base)return"";const p=((cur-base)/base)*100;const s=p.toFixed(2)+"%";return p>0?"+"+s:s}
function normDate(d){return String(d).replace(/\//g,"-").replace(/\./g,"-")}
function toYmdKey(d){return Number(normDate(d).replace(/-/g,""))}
function calendarPrevDay(todayDate){const p=normDate(todayDate).split("-").map(Number);const dt=new Date(Date.UTC(p[0],p[1]-1,p[2]));dt.setUTCDate(dt.getUTCDate()-1);return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`}
function previousBusinessDay(todayDate){let cursor=calendarPrevDay(todayDate);for(let i=0;i<7;i++){const p=cursor.split("-").map(Number);const wd=new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay();if(wd!==0&&wd!==6)return cursor;cursor=calendarPrevDay(cursor)}return cursor}
function resolvePrev(history,todayDate){const targetDate=previousBusinessDay(todayDate);const point=history.find(h=>h.date===targetDate)||null;return{targetDate,point,label:"前一个工作日"}}
function resolveMonthStart(history,todayDate){const t=normDate(todayDate);const [y,m,day]=t.split("-").map(Number);let targetDate;if(day<=2){const prevEnd=new Date(Date.UTC(y,m-1,0));targetDate=`${prevEnd.getUTCFullYear()}-${String(prevEnd.getUTCMonth()+1).padStart(2,"0")}-${String(prevEnd.getUTCDate()).padStart(2,"0")}`}else{targetDate=t.slice(0,7)+"-01"}const point=history.find(h=>h.date===targetDate)||null;return{targetDate,point}}

function renderHkdChart(){
  const labels=HKD_HISTORY.map(h=>shortDate(h.date));
  const data=HKD_HISTORY.map(h=>h.rate);
  new Chart(document.getElementById("hkdChart"),{
    type:"line",
    data:{labels,datasets:[{label:"中间价",data,borderColor:"#16a34a",borderWidth:2,pointRadius:0,tension:0.1,fill:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
      x:{ticks:{maxTicksLimit:12,font:{size:8},maxRotation:45,minRotation:45}},
      y:{min:85,max:93,reverse:true,ticks:{stepSize:1,callback:v=>v.toFixed(2),font:{size:9}}}
    }}
  });
}

async function loadHkdRate(){
  try{
    const [rateRes,historyRes]=await Promise.all([
      fetch(VERCEL_BASE+"/api/dashboard/hkd-rmb-rate"),
      fetch(VERCEL_BASE+"/api/dashboard/hkd-rmb-history")
    ]);
    if(!rateRes.ok||!historyRes.ok) throw new Error("API error");
    const d=await rateRes.json();
    const history=await historyRes.json();
    document.getElementById("hkd-date").textContent=d.date+(d.time?" "+d.time:"");
    const resolvedPrev=resolvePrev(history,d.date);
    const resolvedMonth=resolveMonthStart(history,d.date);
    const prev=resolvedPrev.point;
    const ms=resolvedMonth.point;
    document.getElementById("hkd-table").innerHTML=
      `<table><thead><tr><th></th><th>日期</th><th>汇买</th><th>汇卖</th><th>中行折算价</th><th>买入变动</th><th>卖出变动</th><th>折算变动</th></tr></thead><tbody>`+
      `<tr><td>最新外汇价</td><td>${shortDate(d.date.replace(/\//g,"-"))}</td><td>${fmt2(d.buyRate)}</td><td>${fmt2(d.sellRate)}</td><td>${fmt2(d.midRate)}</td><td></td><td></td><td></td></tr>`+
      `<tr><td>${resolvedPrev.label}</td><td>${shortDate(resolvedPrev.targetDate)}</td><td>${prev&&prev.buy!=null?fmt2(prev.buy):"--"}</td><td>${prev&&prev.sell!=null?fmt2(prev.sell):"--"}</td><td>${prev?fmt2(prev.rate):"--"}</td><td>${prev&&prev.buy!=null?fmtPct(d.buyRate,prev.buy):"--"}</td><td>${prev&&prev.sell!=null?fmtPct(d.sellRate,prev.sell):"--"}</td><td>${prev?fmtPct(d.midRate,prev.rate):"--"}</td></tr>`+
      `<tr><td>与本月初对比</td><td>${shortDate(resolvedMonth.targetDate)}</td><td>${ms&&ms.buy!=null?fmt2(ms.buy):"--"}</td><td>${ms&&ms.sell!=null?fmt2(ms.sell):"--"}</td><td>${ms?fmt2(ms.rate):"--"}</td><td>${ms&&ms.buy!=null?fmtPct(d.buyRate,ms.buy):"--"}</td><td>${ms&&ms.sell!=null?fmtPct(d.sellRate,ms.sell):"--"}</td><td>${ms?fmtPct(d.midRate,ms.rate):"--"}</td></tr>`+
      `</tbody></table>`;
  }catch(e){
    const last=HKD_HISTORY[HKD_HISTORY.length-1];
    document.getElementById("hkd-date").textContent=last.date+" (cached)";
    document.getElementById("hkd-table").innerHTML=`<p class="error">Live rate unavailable. Showing cached mid-rate: ${fmt2(last.rate)}</p>`;
  }
}

// --- Steel ---
const STEEL_COLORS=["#ef4444","#3b82f6","#f59e0b","#111827","#22c55e","#8b5cf6"];
const STEEL_LABELS=["有花：1*1219*C：乐从镇：鞍钢","无花：1*1250*C：乐从镇：鞍钢","无花：1*1250*C：济南：宝钢","无花：1*1250*C：广州：鞍钢","无花：0.8*1250*C：乐从：鞍钢","无花：0.8*1250*C：广州：鞍钢"];

async function loadSteel(){
  try{
    const r=await fetch(VERCEL_BASE+"/api/dashboard/steel-price?seriesLimit=6&pointLimit=365");
    if(!r.ok) throw new Error("API error "+r.status);
    const d=await r.json();
    const pts=d.points||[];
    const series=d.series||[];
    if(!pts.length){throw new Error("No data")}

    document.getElementById("steel-date").textContent="Updated "+pts[pts.length-1].date;

    const labels=pts.map(p=>shortDate(p.date.replace(/\//g,"-")));
    const datasets=series.map((s,i)=>({
      label:s.label,data:pts.map(p=>p[s.key]),
      borderColor:s.color||STEEL_COLORS[i],borderWidth:2,pointRadius:0,tension:0.1,fill:false
    }));

    new Chart(document.getElementById("steelChart"),{
      type:"line",data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{maxTicksLimit:15,font:{size:8},maxRotation:45,minRotation:45}},
          y:{min:4200,max:5700,ticks:{stepSize:300,callback:v=>(v/1000).toFixed(1)+"K",font:{size:9}}}}}
    });

    const leg=document.getElementById("steel-legend");
    leg.innerHTML=series.map((s,i)=>
      `<div class="legend-row"><span class="legend-dot" style="background:${s.color||STEEL_COLORS[i]}"></span>`+
      `<span>${s.label}</span><span class="legend-val">${s.latestValue!=null?Number(s.latestValue).toLocaleString():"--"}</span></div>`
    ).join("");
  }catch(e){
    document.getElementById("steel-date").textContent="Error: "+e.message;
    document.getElementById("steel-legend").innerHTML=`<p class="error">${e.message}</p>`;
  }
}

    }));

    new Chart(document.getElementById("aluminumChart"),{
      type:"line",data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{maxTicksLimit:15,font:{size:8},maxRotation:45,minRotation:45}},
          y:{min:19000,max:26000,ticks:{stepSize:1000,callback:v=>(v/1000).toFixed(1)+"K",font:{size:9}}}}}
    });

    const leg=document.getElementById("aluminum-legend");
    leg.innerHTML=series.map((s,i)=>
      `<div class="legend-row"><span class="legend-dot" style="background:${s.color||["#ef4444","#3b82f6"][i]}"></span>`+
      `<span>${s.label}</span><span class="legend-val">${s.latestValue!=null?Number(s.latestValue).toLocaleString():"--"}</span></div>`
    ).join("");
  }catch(e){
    document.getElementById("aluminum-date").textContent="Error: "+e.message;
    document.getElementById("aluminum-legend").innerHTML=`<p class="error">${e.message}</p>`;
  }
}

// --- Init ---
renderHkdChart();
loadHkdRate();
loadSteel();
loadAluminum();
</script>
</body>
